{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planif | Entrar</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <header class="brand">
                <div class="brand__logo">
                    <!-- Adicione aqui o caminho da sua imagem -->
                    <img src="{% static 'img/logoPlanif.jpeg' %}" alt="Logo do Planif" class="brand__icon">
                    <h1 class="brand__name">PLANIF</h1>
                </div>
                <p class="brand__tagline">Sua agenda acadêmica em um só lugar</p>
            </header>

            <form class="login-form" method="post" action="" novalidate>
                {% csrf_token %}

                <div class="field">
                    <label for="email" class="field__label">E-mail</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M3 7l9 6 9-6"></path>
                        </svg>
                        <input type="email" id="email" name="email" class="field__input"
                               placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>
                    <span class="field__error" id="email-error" role="alert"></span>
                </div>

                <div class="field">
                    <label for="senha" class="field__label">Senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                            <circle cx="12" cy="15.5" r="1" class="dot"></circle>
                        </svg>
                        <input type="password" id="senha" name="password" class="field__input"
                               placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="toggle-password"
                                aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="3" y1="3" x2="21" y2="21" class="slash"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field__error" id="senha-error" role="alert"></span>
                </div>

                <a href="#" class="link link--small">Esqueceu minha senha</a>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="signup">
                Não tem uma conta?
                <a href="{% url 'cadastro' %}" class="link">Criar uma conta</a>
            </p>
        </section>
    </main>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
