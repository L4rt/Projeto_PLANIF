{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planif | Criar conta</title>
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>
<body>
    <main class="page">
        <section class="card">
            <header class="brand">
                <div class="brand__logo">
                    <!-- Adicione aqui o caminho da sua imagem -->
                    <img src="{% static 'img/logoPlanif.jpeg' %}" alt="Logo do Planif" class="brand__icon">
                    <h1 class="brand__name">PLANIF</h1>
                </div>
                <p class="brand__tagline">Sua agenda acadêmica em um só lugar</p>
            </header>

            <h2 class="title">Criar conta</h2>

            <form class="form" id="cadastro-form" method="post" action="" novalidate>
                {% csrf_token %}

                <div class="field">
                    <label for="nome" class="field__label">Nome completo</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="8" r="4"></circle>
                            <path d="M4 20c0-4 4-6 8-6s8 2 8 6"></path>
                        </svg>
                        <input type="text" id="nome" name="nome" class="field__input"
                               placeholder="Digite seu nome completo" autocomplete="name" required>
                    </div>
                    <span class="field__error" role="alert"></span>
                </div>

                <div class="field">
                    <label for="email" class="field__label">E-mail</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                            <path d="M3 7l9 6 9-6"></path>
                        </svg>
                        <input type="email" id="email" name="email" class="field__input"
                               placeholder="Digite seu e-mail" autocomplete="email" required>
                    </div>
                    <span class="field__error" role="alert"></span>
                </div>

                <div class="field">
                    <label for="senha" class="field__label">Senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                            <circle cx="12" cy="15.5" r="1" class="dot"></circle>
                        </svg>
                        <input type="password" id="senha" name="password1" class="field__input"
                               placeholder="Digite sua senha" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="senha"
                                aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="3" y1="3" x2="21" y2="21" class="slash"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field__error" role="alert"></span>
                </div>

                <div class="field">
                    <label for="confirmar-senha" class="field__label">Confirmar senha</label>
                    <div class="field__control">
                        <svg class="field__icon" viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="5" y="11" width="14" height="9" rx="2"></rect>
                            <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                            <circle cx="12" cy="15.5" r="1" class="dot"></circle>
                        </svg>
                        <input type="password" id="confirmar-senha" name="password2" class="field__input"
                               placeholder="Confirme sua senha" autocomplete="new-password" required>
                        <button type="button" class="toggle-password" data-target="confirmar-senha"
                                aria-label="Mostrar senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                                <line x1="3" y1="3" x2="21" y2="21" class="slash"></line>
                            </svg>
                        </button>
                    </div>
                    <span class="field__error" role="alert"></span>
                </div>

                <fieldset class="perfil">
                    <legend class="field__label">Perfil</legend>
                    <div class="perfil__options">
                        <label class="radio">
                            <input type="radio" name="perfil" value="aluno" checked>
                            <span class="radio__mark"></span>
                            <span class="radio__text">Aluno</span>
                        </label>
                        <label class="radio">
                            <input type="radio" name="perfil" value="professor">
                            <span class="radio__mark"></span>
                            <span class="radio__text">Professor</span>
                        </label>
                    </div>
                </fieldset>

                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>

            <p class="signin">
                Já tenho uma conta?
                <a href="{% url 'login' %}" class="link">Entrar</a>
            </p>
        </section>
    </main>

    <script src="{% static 'js/cadastro.js' %}"></script>
</body>
</html>
