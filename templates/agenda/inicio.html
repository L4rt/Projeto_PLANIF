{% extends "base.html" %}
{% load static %}

{% block title %}Calendário | PLANIF{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
{% endblock %}

{% block content %}
<section class="cal" aria-labelledby="calTitulo">

  <!-- ===== TOPO: título, navegação e botão de novo item ===== -->
  <header class="cal__topo">
    <div class="cal__esquerda">
      <h1 class="cal__titulo" id="calTitulo" aria-live="polite">Calendário</h1>

      <div class="cal__nav">
        <button class="nav-btn" id="btnAnterior" type="button" aria-label="Semana anterior">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="nav-btn" id="btnProximo" type="button" aria-label="Próxima semana">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="hoje-btn" id="btnHoje" type="button">Hoje</button>
        <p class="cal__subtitulo" id="calSubtitulo"></p>
      </div>
    </div>

    <div class="cal__controles">
      <div class="cal__navegar">
        <span class="cal__navegar-rotulo" id="rotuloNavegar">Navegar:</span>
        <div class="seg" role="group" aria-labelledby="rotuloNavegar">
          <button class="seg__btn" type="button" data-visao="mes" aria-pressed="false">Mês</button>
          <button class="seg__btn" type="button" data-visao="semana" aria-pressed="false">Semana</button>
          <button class="seg__btn" type="button" data-visao="dia" aria-pressed="false">Dia</button>
        </div>
      </div>

      <button class="btn-novo" id="btnNovo" type="button">+ Novo Evento ou Tarefa</button>
    </div>
  </header>

  <!-- ===== GRADE (montada pelo JavaScript) ===== -->
  <div class="cal__area">
    <div class="grade" id="calGrade" role="group" aria-label="Calendário"></div>
  </div>

</section>

<!-- ===== JANELA: novo / editar evento ou tarefa ===== -->
<dialog class="modal" id="modalEvento" aria-labelledby="modalTitulo">
  <form class="modal__form" id="formEvento">
    <h2 class="modal__titulo" id="modalTitulo">Novo evento ou tarefa</h2>

    <div class="campo">
      <label for="evTitulo">Título</label>
      <input type="text" id="evTitulo" name="titulo" maxlength="60" required autocomplete="off">
    </div>

    <fieldset class="campo campo--tipo">
      <legend>Tipo</legend>
      <label class="opcao"><input type="radio" name="tipo" value="evento" checked> Evento</label>
      <label class="opcao"><input type="radio" name="tipo" value="tarefa"> Tarefa</label>
    </fieldset>

    <div class="campo-linha">
      <div class="campo">
        <label for="evData">Data</label>
        <input type="date" id="evData" name="data" required>
      </div>
      <div class="campo">
        <label for="evSlot">Horário</label>
        <select id="evSlot" name="slot"></select>
      </div>
    </div>

    <div class="modal__acoes">
      <button class="btn btn--perigo" id="btnExcluir" type="button" hidden>Excluir</button>
      <button class="btn btn--neutro" id="btnCancelar" type="button">Cancelar</button>
      <button class="btn btn--principal" type="submit">Salvar</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block extra_js %}
  <script src="{% static 'js/inicio.js' %}"></script>
{% endblock %}
